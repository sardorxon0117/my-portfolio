<main>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script>
  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  const bindings = [];
  function bindText(el, i18nMap) {
    if (!el) return;
    bindings.push({ el, i18nMap: i18nMap || {} });
    el.textContent = (i18nMap && i18nMap[getLocale()]) || '';
  }
  function refreshBindings() {
    const loc = getLocale();
    bindings.forEach(({ el, i18nMap }) => { el.textContent = i18nMap[loc] || ''; });
  }

  function wireCursorLabel(el) {
    if ('ontouchstart' in window) return;
    const pointer = document.getElementById('cursor-pointer');
    const ring = document.getElementById('cursor-ring');
    const label = document.getElementById('cursor-label');
    if (!pointer || !ring) return;
    el.addEventListener('mouseenter', () => {
      label.textContent = el.dataset.cursorLabel || '';
      ring.classList.add('labeled');
      pointer.classList.add('hidden-cursor');
    });
    el.addEventListener('mouseleave', () => {
      ring.classList.remove('labeled');
      pointer.classList.remove('hidden-cursor');
    });
  }

  function observeReveal(el) {
    new IntersectionObserver((entries, obs) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'none';
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' }).observe(el);
  }

  let allProjects = [];
  const grid = document.getElementById('all-projects-grid');
  const searchInput = document.getElementById('projects-search');

  function resetCursorState() {
    document.getElementById('cursor-ring')?.classList.remove('labeled');
    document.getElementById('cursor-pointer')?.classList.remove('hidden-cursor');
  }

  function renderGrid(term) {
    term = (term || '').trim().toLowerCase();
    const filtered = !term ? allProjects : allProjects.filter((p) => {
      const titles = Object.values(p.title || {}).join(' ').toLowerCase();
      const tags = (p.tags || []).join(' ').toLowerCase();
      return p.slug.toLowerCase().includes(term) || titles.includes(term) || tags.includes(term);
    });

    resetCursorState();
    grid.innerHTML = '';
    if (!filtered.length) {
      grid.innerHTML = `<p class="no-results">${getLocale() === 'en' ? 'No projects found.' : getLocale() === 'ru' ? 'Проекты не найдены.' : getLocale() === 'uz_cyr' ? 'Ҳеч нарса топилмади.' : 'Hech narsa topilmadi.'}</p>`;
      return;
    }

    filtered.forEach((p) => {
      const card = document.createElement('a');
      card.href = `project.html?slug=${encodeURIComponent(p.slug)}`;
      card.className = 'project-card glass';
      card.dataset.cursorLabel = "Ko'rish";
      card.style.cssText = 'opacity:0;transform:translateY(32px);transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);';
      card.innerHTML = `
        <div class="project-card-visual">${p.image_url ? `<img src="${esc(p.image_url)}" style="width:100%;height:100%;object-fit:cover;">` : (p.icon || '🛍️')}</div>
        <div class="project-card-body">
          <h3></h3>
          <p></p>
          <div class="tags">${(p.tags || []).map((tag) => `<span>${esc(tag)}</span>`).join('')}</div>
        </div>
      `;
      grid.appendChild(card);
      bindText(card.querySelector('h3'), p.title || {});
      bindText(card.querySelector('p'), p.tagline || {});
      observeReveal(card);
      wireCursorLabel(card);
    });
  }

  searchInput.addEventListener('input', () => renderGrid(searchInput.value));

  async function init() {
    applyStaticStrings();
    updateLangSwitchUI();
    wireLangSwitch(() => { refreshBindings(); renderGrid(searchInput.value); });

    try {
      allProjects = await fetch('/api/projects').then((r) => r.json());
    } catch (err) {
      console.error(err);
    }

    renderGrid();
  }

  init();
</script>
</body>
</html>
